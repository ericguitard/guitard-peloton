name: Deploy Peloton report

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-peloton-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peloton-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish and verify report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Purge Cloudflare page and data cache
        if: env.SITE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          from urllib.parse import urljoin, urlsplit

          site = os.environ["SITE_URL"].rstrip("/") + "/"
          parsed = urlsplit(site)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("SITE_URL must be an https URL")

          urls = [site, urljoin(site, "data/peloton_data.json")]
          endpoint = "https://api.cloudflare.com/client/v4/zones/{}/purge_cache".format(
              os.environ["CLOUDFLARE_ZONE_ID"]
          )
          body = json.dumps({"files": urls}).encode()
          request = urllib.request.Request(
              endpoint,
              data=body,
              headers={
                  "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare cache purge failed (HTTP {})".format(error.code))
          if result.get("success") is not True:
              raise SystemExit("Cloudflare rejected the cache purge request")
          print("Purged the report page and Peloton data JSON from Cloudflare.")
          PY

      - name: Verify live report and data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          site = os.environ.get("SITE_URL", "").strip() or os.environ["PAGE_URL"]
          site = site.rstrip("/") + "/"
          parsed = urlsplit(site)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("SITE_URL or Pages URL must be an https URL")

          paths = ["", "data/peloton_data.json"]
          last_error = None
          for attempt in range(1, 7):
              try:
                  for path in paths:
                      request = urllib.request.Request(
                          urljoin(site, path),
                          headers={"Cache-Control": "no-cache"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          if response.status != 200:
                              raise RuntimeError("{} returned HTTP {}".format(path or "/", response.status))
                      if path.endswith(".json"):
                          data = json.loads(body)
                          if data.get("source") != "peloton-api" or not isinstance(data.get("rows"), list):
                              raise RuntimeError("Peloton data JSON is missing expected fields")
                  print("Live report and Peloton data returned valid responses.")
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as error:
                  last_error = error
                  if attempt == 6:
                      raise SystemExit("Live site verification failed: {}".format(error))
                  time.sleep(10)
          PY

      - name: Note skipped Cloudflare purge
        if: env.SITE_URL == '' || env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ZONE_ID == ''
        run: echo "Cloudflare purge skipped; configure SITE_URL, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ZONE_ID to enable it."
