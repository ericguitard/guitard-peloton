Component.prototype.fetchLive = async function (quiet) {
  if (this.state.fetching) return;
  this.setState({ fetching: true, loadMsg: quiet ? '' : 'Loading the latest data…' });
  try {
    const r = await fetch('data/peloton_data.json?ts=' + Date.now(), { cache: 'no-store' });

    const p = await r.json();
    const cv = this.convert(p);
    try { window.localStorage.setItem('pelotonReportData', JSON.stringify(p)); } catch (err) {}

    if (!quiet) patch.f = { d: -1, i: -1, t: -1, l: -1, p: null };
    this.setState(patch);
  } catch (e) {
    this.setState({ fetching: false, loadMsg: 'Couldn’t load the latest data: ' + e.message + (this.state.loaded ? ' · showing the copy saved in this browser' : '') });
  }
};

    const table = workoutLogTable();

    const rows = [...table.querySelectorAll('tr')].map((row) => [...row.children].map((cell) => '"' + cell.textContent.replace(/\s+/g, ' ').trim().replace(/"/g, '""') + '"').join(','));
    const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'peloton-workout-log.csv'; link.click(); URL.revokeObjectURL(link.href);
  };
  const installLogExport = () => {
    const table = workoutLogTable();
    if (!table || document.querySelector('[data-export-log]')) return;
    const button = document.createElement('button'); button.type = 'button'; button.dataset.exportLog = 'true'; button.textContent = 'Export filtered CSV'; button.title = 'Download the currently visible workout log as CSV'; button.style.cssText = 'min-height:36px;padding:0 12px;border-radius:999px;background:#FFFFFF;border:1px solid #C9CDD3;color:#3A5A8C;font:inherit;font-size:13px;font-weight:600;cursor:pointer;'; button.addEventListener('click', exportWorkoutLog); table.closest('section')?.insertBefore(button, table.parentElement);
  };
  let exportTicks = 0; const exportTimer = window.setInterval(() => { installLogExport(); if (++exportTicks > 60) window.clearInterval(exportTimer); }, 1000);
  document.addEventListener('keydown', (event) => {
    if (event.altKey && /^[1-4]$/.test(event.key)) { const button = [...document.querySelectorAll('nav[aria-label="Report pages"] button')][Number(event.key) - 1]; if (button) { event.preventDefault(); button.click(); } }
    if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'e' && isWorkoutLog()) { event.preventDefault(); exportWorkoutLog(); }
  });
})();
</script>
