name: Validate Peloton repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate Python sources
        run: python -m compileall -q collector

      - name: Install Vue compiler
        run: npm install --no-save --ignore-scripts @vue/compiler-dom@3.4.21

      - name: Build runtime-only report
        run: |
          mkdir -p work
          node scripts/compile-report.mjs docs/index.html work/index.html
          if grep -q "unsafe-eval" work/index.html; then exit 1; fi
          if grep -q "vue.global.prod.js" work/index.html; then exit 1; fi
          test -s work/index.html
          test -s work/report-app.js
          test -s work/report.css
          node -e "const fs=require('fs'),vm=require('vm');try{new vm.Script(fs.readFileSync('work/report-app.js','utf8'))}catch(e){console.error(JSON.stringify({name:e.name,message:e.message,line:e.lineNumber,column:e.columnNumber,pos:e.pos}));process.exit(1)}"

      - name: Print CSP script hash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path
          html = Path('work/index.html').read_text(encoding='utf-8')
          scripts = [m.group(1) for m in re.finditer(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I) if m.group(1)]
          if not scripts:
              print('No inline scripts; report uses same-origin external assets.')
              raise SystemExit(0)
          for script in scripts:
              digest = hashlib.sha256(script.encode()).digest()
              print('CSP script hash: sha256-' + base64.b64encode(digest).decode())
          PY

      - name: Validate report and data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          if 'peloton_data.json' not in html or 'createApp' not in html: raise SystemExit('report wiring is incomplete')
          data = json.loads(Path('docs/data/peloton_data.json').read_text(encoding='utf-8'))
          if data.get('source') != 'peloton-api' or not isinstance(data.get('rows'), list): raise SystemExit('data schema is invalid')
          print(f"validated {len(data['rows'])} workout rows")
          PY

      - name: Verify secret detection does not echo matches
        run: |
          python - <<'PY'
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path
          workflow = Path('.github/workflows/validate.yml').read_text()
          scanner = next(line.strip()[3:-6] for line in workflow.splitlines() if line.strip().startswith('if grep '))
          with tempfile.TemporaryDirectory() as directory:
              fixture = Path(directory) / 'fixture.txt'
              for content, expected in [('PELOTON_' + 'TOKEN=' + 'synthetic-test-value', 0), ('ordinary content', 1)]:
                  fixture.write_text(content)
                  result = subprocess.run(shlex.split(scanner), cwd=directory, capture_output=True)
                  if result.returncode != expected or result.stdout or result.stderr:
                      raise SystemExit(f'Secret scanner regression: expected {expected}, got {result.returncode}; output bytes {len(result.stdout)}/{len(result.stderr)}')
          print('Secret detection and silent output verified with synthetic fixtures.')
          PY

      - name: Check for accidental secrets
        shell: bash
        run: |
          if grep -Rq --exclude-dir=.git --exclude-dir=.github --exclude=peloton_data.json -E '(Authorization: Bearer [A-Za-z0-9._-]{20,}|PELOTON_TOKEN=.{8,}|-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----)' .; then
            echo '::error::Possible credential material found in tracked files.'
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check
