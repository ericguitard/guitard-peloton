name: Refresh Peloton data

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: peloton-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: Fetch and commit workout data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      data_commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check "requests==2.34.2"

      - name: Check required secret
        env:
          PELOTON_TOKEN: ${{ secrets.PELOTON_TOKEN }}
        run: |
          if [ -z "$PELOTON_TOKEN" ]; then
            echo "::error::PELOTON_TOKEN is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Fetch from Peloton
        env:
          PELOTON_TOKEN: ${{ secrets.PELOTON_TOKEN }}
        run: python collector/peloton_collector.py --out docs/data/peloton_data.json

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/peloton_data.json
          if git diff --cached --quiet; then
            echo "No change in Peloton data"
          else
            git commit -m "Peloton data $(date -u +%F)"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: always() && github.ref == 'refs/heads/main' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped' || needs.refresh.result == 'failure')
    name: Publish and verify report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://peloton.guitard.ca/
    steps:
      - name: Check out deployment contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.data_commit_sha || github.sha }}
          persist-credentials: false

      - name: Install Vue compiler
        run: npm install --no-save --ignore-scripts @vue/compiler-dom@3.4.21

      - name: Build runtime-only report
        run: |
          node scripts/compile-report.mjs docs/index.html docs/index.html
          if grep -q "unsafe-eval" docs/index.html; then
            echo "::error::Generated report still contains unsafe-eval"
            exit 1
          fi
          if grep -q "vue.global.prod.js" docs/index.html; then
            echo "::error::Generated report still references the compiler-including Vue build"
            exit 1
          fi
          if ! grep -q "var Vue=" docs/index.html; then
            echo "::error::Generated report does not contain the self-contained Vue runtime"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Purge Cloudflare page and data cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin

          token = os.environ.get("CLOUDFLARE_API_TOKEN")
          zone_id = os.environ.get("CLOUDFLARE_ZONE_ID")
          if not token or not zone_id:
              print("Cloudflare purge skipped; configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID to enable it.")
              raise SystemExit(0)

          site = os.environ["SITE_URL"]
          urls = [site, urljoin(site, "data/peloton_data.json")]
          endpoint = "https://api.cloudflare.com/client/v4/zones/{}/purge_cache".format(zone_id)
          request = urllib.request.Request(endpoint, data=json.dumps({"files": urls}).encode(), headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print("::warning::Cloudflare cache purge failed (HTTP {}); continuing because the Pages deployment already succeeded.".format(error.code))
              raise SystemExit(0)
          if result.get("success") is not True:
              print("::warning::Cloudflare rejected the cache purge request; continuing because the Pages deployment already succeeded.")
              raise SystemExit(0)
          print("Purged the report page and Peloton data JSON from Cloudflare.")
          PY

      - name: Verify live report and data
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          site = os.environ["SITE_URL"]
          parsed = urlsplit(site)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("SITE_URL must be an https URL")

          for attempt in range(1, 7):
              try:
                  for path in ("", "data/peloton_data.json"):
                      request = urllib.request.Request(urljoin(site, path), headers={"Cache-Control": "no-cache", "User-Agent": "guitard-peloton-deploy/1.0"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                      if path.endswith(".json"):
                          data = json.loads(body)
                          if data.get("source") != "peloton-api" or not isinstance(data.get("rows"), list):
                              raise RuntimeError("Peloton data JSON is missing expected fields")
                  print("Live report and Peloton data returned valid responses.")
                  break
              except (OSError, ValueError, RuntimeError) as error:
                  if attempt == 6:
                      raise SystemExit("Live site verification failed: {}".format(error))
                  time.sleep(10)
          PY


